name: trend-agent

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST every day: collect data
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: trend-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect daily sources (Wikipedia, Reddit)
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python collect.py --sources wikipedia,reddit

      # Each Google Trends request back-fills 90 days, so weekly is enough, and it keeps us
      # well clear of Google's rate limits on shared cloud IPs.
      - name: Collect Google Trends (Mondays, or when run by hand)
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            python collect.py --sources trends
          else
            echo "Not Monday; skipping Google Trends."
          fi

      # YouTube search is capped at about 100 searches a day by the free quota, and a full pass needs about 104.
      # It runs Monday, and again Tuesday to pick up whatever Monday could not reach (series collected within
      # the last 3 days are skipped, so Tuesday only fetches the leftovers).
      - name: Collect YouTube (Mondays and Tuesdays, or when run by hand)
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          DOW="$(date -u +%u)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$DOW" = "1" ] || [ "$DOW" = "2" ]; then
            python collect.py --sources youtube
          else
            echo "Not Monday or Tuesday; skipping YouTube."
          fi

      # GDELT also back-fills about 3 months per request and asks for one request every 5 seconds,
      # so it runs weekly alongside Google Trends (about 10 minutes).
      - name: Collect GDELT news volume (Mondays, or when run by hand)
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            python collect.py --sources gdelt
          else
            echo "Not Monday; skipping GDELT."
          fi

      - name: Write weekly brief (Mondays, or when run by hand)
        env:
          EVENT_NAME: ${{ github.event_name }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            python analyze.py
          else
            echo "Not Monday; skipping brief."
          fi

      - name: Commit data and brief
        run: |
          git config user.name "trend-agent"
          git config user.email "trend-agent@users.noreply.github.com"
          git add data briefs
          git diff --cached --quiet || git commit -m "Update trend data $(date -u +%F)"
          git push
